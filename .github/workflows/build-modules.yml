name: Build dimensionModules and upload artifact

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-upload:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run buildImports script
        run: pnpm run build

      - name: Publish dimensionModules.json as "latest" release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: latest
          name: Latest dimensionModules
          artifacts: cli/dimensionModules.json
          allowUpdates: true